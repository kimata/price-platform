<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" fill="#1f2328" font-weight="700" font-size="15">計測サブシステム(metrics/ = server / client / render)</text>

  <!-- server 系 -->
  <rect x="30" y="60" width="440" height="200" rx="8" fill="#e2f6ee" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="46" y="84" fill="#0e7a54" font-weight="700">metrics/server — クロール実績(サーバー側)</text>
  <rect x="46" y="98" width="190" height="44" rx="6" fill="#ffffff" stroke="#8fdcc0"/>
  <text x="141" y="117" text-anchor="middle" fill="#1f2328" font-size="12">クローラ</text>
  <text x="141" y="133" text-anchor="middle" fill="#57606a" font-size="11">(アプリ側)</text>
  <line x1="236" y1="120" x2="278" y2="120" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="282" y="98" width="172" height="44" rx="6" fill="#ffffff" stroke="#8fdcc0"/>
  <text x="368" y="117" text-anchor="middle" fill="#1f2328" font-size="12">managers/metrics_manager</text>
  <text x="368" y="133" text-anchor="middle" fill="#57606a" font-size="11">セッション/アイテム計時(CM 対応)</text>
  <line x1="368" y1="142" x2="368" y2="168" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="46" y="172" width="408" height="74" rx="6" fill="#ffffff" stroke="#8fdcc0"/>
  <text x="60" y="192" fill="#1f2328" font-weight="700" font-size="12">MetricsDB(server/db)+ writes / reads</text>
  <text x="60" y="210" fill="#1f2328" font-size="11.5">crawl_sessions / store_crawl_stats / item_crawl_stats / amazon_batch_stats</text>
  <text x="60" y="228" fill="#1f2328" font-size="11.5">集計: ストア別統計(成功のみの平均)・ヒートマップ・失敗時系列</text>

  <!-- client 系 -->
  <rect x="490" y="60" width="440" height="200" rx="8" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="506" y="84" fill="#1c5cab" font-weight="700">metrics/client — 閲覧品質(ブラウザ側)</text>
  <rect x="506" y="98" width="180" height="44" rx="6" fill="#ffffff" stroke="#9ec5f4"/>
  <text x="596" y="117" text-anchor="middle" fill="#1f2328" font-size="12">ブラウザビーコン</text>
  <text x="596" y="133" text-anchor="middle" fill="#57606a" font-size="11">(アプリの計測 API 経由)</text>
  <line x1="686" y1="120" x2="728" y2="120" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="732" y="98" width="182" height="44" rx="6" fill="#ffffff" stroke="#9ec5f4"/>
  <text x="823" y="117" text-anchor="middle" fill="#1f2328" font-size="12">ClientMetricsDB(client/db)</text>
  <text x="823" y="133" text-anchor="middle" fill="#57606a" font-size="11">raw 記録(RLock 直列化)</text>
  <line x1="823" y1="142" x2="823" y2="168" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="506" y="172" width="408" height="74" rx="6" fill="#ffffff" stroke="#9ec5f4"/>
  <text x="520" y="192" fill="#1f2328" font-weight="700" font-size="12">writes(日次集計)+ boxplot / web_vitals / social_referrals</text>
  <text x="520" y="210" fill="#1f2328" font-size="11.5">四分位計算は client/quartiles.compute_quartiles に一本化</text>
  <text x="520" y="228" fill="#1f2328" font-size="11.5">Web Vitals は good / needs-improvement / poor の割合も集計</text>

  <!-- render -->
  <line x1="250" y1="260" x2="250" y2="296" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="710" y1="260" x2="710" y2="296" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="30" y="300" width="900" height="92" rx="8" fill="#fdf3d7" stroke="#c98500" stroke-width="1.4"/>
  <text x="46" y="324" fill="#8a5a00" font-weight="700">metrics/render — 可視化(SVG 生成)</text>
  <text x="46" y="346" fill="#1f2328" font-size="12">boxplot_svg: 日次箱ひげ図(タイトルはエスケープ、上限付き LRU キャッシュ、全値 0 でも安全)</text>
  <text x="46" y="366" fill="#1f2328" font-size="12">memory_svg: プロセスメモリ推移(managers/pod_memory_tracker のスナップショットを描画)</text>

  <line x1="480" y1="392" x2="480" y2="424" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="280" y="428" width="400" height="52" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.3"/>
  <text x="480" y="450" text-anchor="middle" fill="#1f2328" font-weight="700">アプリの管理ダッシュボード(/metrics)</text>
  <text x="480" y="470" text-anchor="middle" fill="#57606a" font-size="11">metrics 認証(auth/metrics_auth)で保護</text>
</svg>
