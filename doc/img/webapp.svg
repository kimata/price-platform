<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="30" y="34" fill="#1f2328" font-weight="700" font-size="15">Web アプリ骨格と認証(application / webapp / auth)</text>

  <!-- アプリからの入力 -->
  <rect x="30" y="56" width="900" height="84" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.3"/>
  <text x="46" y="80" fill="#1f2328" font-weight="700">アプリ(server.py)が宣言するもの</text>
  <text x="46" y="102" fill="#1f2328" font-size="12">AppIdentity(slug / URL prefix / 設定 env)・StandardWebApiAppDefinition(blueprints / CacheRule / CSP / SEO・メモリ routes / warmup)</text>
  <text x="46" y="122" fill="#1f2328" font-size="12">AppDependencies(config / stores / services。build_service_builder + ServiceFactories で組み立て)</text>

  <line x1="480" y1="140" x2="480" y2="172" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- application -->
  <rect x="30" y="176" width="900" height="70" rx="8" fill="#edeafa" stroke="#4a3aa7" stroke-width="1.5"/>
  <text x="46" y="200" fill="#3b2e86" font-weight="700">application.create_standard_webapi_app()</text>
  <text x="46" y="222" fill="#1f2328" font-size="12">create_standard_platform_spec → webapp.create_configured_platform_app で共通処理を一括適用し、依存を Flask に注入</text>

  <line x1="230" y1="246" x2="230" y2="278" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="700" y1="246" x2="700" y2="278" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- webapp 共通処理 -->
  <rect x="30" y="282" width="430" height="180" rx="8" fill="#f8f9fa" stroke="#4a3aa7" stroke-width="1.4"/>
  <text x="46" y="306" fill="#3b2e86" font-weight="700">webapp/ — 全アプリ共通のミドルウェア</text>
  <text x="46" y="330" fill="#1f2328" font-size="12">・CORS: external_url から許可 origin を導出(cors.py)</text>
  <text x="46" y="350" fill="#1f2328" font-size="12">・セキュリティヘッダ: CSP / HSTS / no-store(headers.py)</text>
  <text x="46" y="370" fill="#1f2328" font-size="12">・パス別キャッシュ制御(CacheRule)</text>
  <text x="46" y="390" fill="#1f2328" font-size="12">・リクエストスコープ DB 接続 + スロークエリログ(request_context)</text>
  <text x="46" y="410" fill="#1f2328" font-size="12">・SEO routes: sitemap.xml / robots.txt / 画像 sitemap(_seo_routes)</text>
  <text x="46" y="430" fill="#1f2328" font-size="12">・healthz / メモリスナップショット routes</text>

  <!-- auth -->
  <rect x="500" y="282" width="430" height="180" rx="8" fill="#fdeaea" stroke="#d03b3b" stroke-width="1.4"/>
  <text x="516" y="306" fill="#a32b2b" font-weight="700">auth/ — 認証 2 系統(JWT 発行・検証は _jwt_service に共通化)</text>
  <text x="516" y="330" fill="#1f2328" font-size="12">API トークン: GET /token(同一オリジン検査)→ 短命 JWT(type=api)</text>
  <text x="516" y="350" fill="#1f2328" font-size="12">  保護 API は require_api_token(X-Api-Token)で検証</text>
  <text x="516" y="370" fill="#1f2328" font-size="12">  SSR 内部リクエストは X-SSR-Internal 共有シークレットで通過</text>
  <text x="516" y="392" fill="#1f2328" font-size="12">metrics 認証: /login(Argon2id + InMemoryRateLimiter)</text>
  <text x="516" y="412" fill="#1f2328" font-size="12">  → Bearer JWT で管理画面 API を保護</text>
  <text x="516" y="436" fill="#57606a" font-size="11">ローカル origin の無条件許可は環境フラグによるオプトイン(CI/E2E 用)</text>

  <!-- リクエストフロー -->
  <rect x="30" y="494" width="900" height="118" rx="8" fill="#f8f9fa" stroke="#d0d4da"/>
  <text x="46" y="518" fill="#1f2328" font-weight="700">リクエストの流れ(本番構成)</text>
  <g font-size="12">
    <rect x="46" y="532" width="150" height="40" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="121" y="557" text-anchor="middle" fill="#1f2328">ブラウザ</text>
    <line x1="196" y1="552" x2="240" y2="552" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="244" y="532" width="220" height="40" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="354" y="551" text-anchor="middle" fill="#1f2328">Node SSR サーバー(アプリ側)</text>
    <line x1="464" y1="552" x2="508" y2="552" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="512" y="532" width="240" height="40" rx="6" fill="#edeafa" stroke="#4a3aa7"/>
    <text x="632" y="551" text-anchor="middle" fill="#1f2328">Flask API(この骨格で構築)</text>
    <text x="465" y="590" fill="#57606a" font-size="11">SSR→API は X-SSR-Internal、ブラウザ→API は /token で得た X-Api-Token を付与</text>
  </g>
</svg>
